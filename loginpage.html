<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#d9dadb",
                    "on-tertiary-fixed": "#0f1c2c",
                    "tertiary": "#1e2c3b",
                    "on-secondary-fixed": "#00201c",
                    "error-container": "#ffdad6",
                    "surface": "#f8f9fa",
                    "on-secondary-container": "#106f65",
                    "background": "#f8f9fa",
                    "primary-container": "#2d425a",
                    "surface-container-highest": "#e1e3e4",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#d6e4f9",
                    "error": "#ba1a1a",
                    "on-tertiary-container": "#a0aec2",
                    "on-surface": "#191c1d",
                    "on-error": "#ffffff",
                    "surface-container": "#edeeef",
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#43474d",
                    "inverse-primary": "#b3c8e6",
                    "tertiary-container": "#344252",
                    "primary": "#162c43",
                    "secondary": "#046a61",
                    "on-primary-container": "#99aecb",
                    "surface-tint": "#4b6079",
                    "inverse-on-surface": "#f0f1f2",
                    "on-primary-fixed": "#041d33",
                    "on-secondary-fixed-variant": "#005049",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#3a4859",
                    "on-primary-fixed-variant": "#334861",
                    "secondary-fixed-dim": "#84d5c9",
                    "secondary-fixed": "#a0f1e5",
                    "surface-container-low": "#f3f4f5",
                    "surface-bright": "#f8f9fa",
                    "inverse-surface": "#2e3132",
                    "primary-fixed": "#d1e4ff",
                    "tertiary-fixed-dim": "#bac8dc",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e7e8e9",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#b3c8e6",
                    "secondary-container": "#9defe2",
                    "outline": "#74777d",
                    "surface-variant": "#e1e3e4",
                    "outline-variant": "#c4c6cd",
                    "on-background": "#191c1d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "48px",
                    "md": "24px",
                    "sm": "12px",
                    "margin-desktop": "120px",
                    "base": "8px",
                    "margin-mobile": "16px",
                    "xl": "80px",
                    "gutter": "24px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Hanken Grotesk"],
                    "caption": ["Hanken Grotesk"],
                    "title-md": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #f8f9fa;
        }
        .login-card {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col">
<!-- TopNavBar Suppressed for Transactional Page as per Shell Visibility Rules -->
<style>
    @media (max-width: 768px) {
        .h-20, .md\:h-24, .lg\:h-28 { height: 56px !important; }
        .text-title-md, .lg\:text-\[22px\] { font-size: 18px !important; }
    }
</style>
<main class="flex-grow flex items-start justify-center px-margin-mobile md:px-0 pt-5 md:pt-3 pb-4">
<div class="w-full max-w-[440px]">
<!-- Brand Anchor Header -->
<div class="text-center mb-5 md:mb-4 flex flex-col items-center gap-2">
<img src="impimage.png" 
         alt="Genztech Logo"
         class="h-14 w-auto mx-auto" style="display:none;" />
<div class="flex items-center justify-center -mt-2 md:-mt-4 mb-1">
    <img src="genztech_logo.png" alt="Genztech Logo" style="height:94px; width:auto; object-fit:contain;" />
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your professional growth portal.</p>
</div>
<!-- Login Form Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant rounded-xl p-md md:p-lg">
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-base top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-base py-sm bg-surface-container border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-base top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-base py-sm bg-surface-container border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-base">
<input class="w-base h-base text-secondary border-outline-variant rounded focus:ring-secondary" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant select-none" for="remember">Remember Me</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-bold py-sm px-md rounded-full hover:bg-primary-container transition-all flex justify-center items-center gap-base" type="submit">
                        Log In
                        <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<div class="mt-md pt-md border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New to Genztech? 
                        <a class="text-secondary font-bold hover:underline transition-all" href="signuppage.html">Sign Up</a>
</p>
</div>
</div>
<!-- Trust Indicator / Minimalism -->
<div class="mt-4 text-center">
<div class="flex justify-center items-center gap-sm text-outline opacity-60">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="font-caption text-caption">Enterprise-grade security &amp; encryption</span>
</div>
</div>
</div>
</main>
<!-- Footer Suppressed as per Shell Relevance Rule for simple login -->
<footer class="w-full px-margin-mobile md:px-margin-desktop py-2 flex flex-col md:flex-row justify-center items-center gap-sm">
<p class="font-caption text-caption text-on-surface-variant opacity-70">
            © 2024 Genztech IT Training &amp; Consulting. A VSK Enterprises Tech Venture.
        </p>
</footer>
<!-- Subtle Background Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden opacity-20">
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] bg-secondary rounded-full mix-blend-multiply filter blur-[80px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-primary-container rounded-full mix-blend-multiply filter blur-[80px]"></div>
</div>
<script src="assets/js/genztech.js"></script>
</body></html>
